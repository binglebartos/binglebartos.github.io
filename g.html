<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Velora — V7 (maybe?)">
    <meta property="og:title" content="Velora">
    <meta property="og:description" content="The ultimate gateway to unblocked games at school">
    <meta property="og:type" content="website">

    <title>Velora</title>

    <link rel="stylesheet" href="assets/app.css">

    <style>
        :root {
            --bg: #080a0f;
            --bg-2: #0e1118;
            --surface: rgba(18, 22, 30, 0.84);
            --surface-2: rgba(27, 32, 43, 0.82);
            --surface-3: rgba(255, 255, 255, 0.055);
            --text: #f7f9fc;
            --muted: #9aa5b5;
            --border: rgba(255, 255, 255, 0.09);
            --border-strong: rgba(255, 255, 255, 0.15);
            --accent: #00e0a8;
            --accent-2: #4ba3ff;
            --accent-hover: #00c893;
            --danger: #ff6b78;
            --shadow: 0 16px 45px rgba(0, 0, 0, 0.34);
            --radius: 18px;
        }

        body.light {
            --bg: #eef4f8;
            --bg-2: #f7fafc;
            --surface: rgba(255, 255, 255, 0.88);
            --surface-2: rgba(247, 250, 252, 0.94);
            --surface-3: rgba(0, 0, 0, 0.035);
            --text: #10151c;
            --muted: #64707f;
            --border: rgba(16, 21, 28, 0.08);
            --border-strong: rgba(16, 21, 28, 0.14);
            --accent: #00b98b;
            --accent-2: #3587e8;
            --accent-hover: #009f78;
            --danger: #dc4d5a;
            --shadow: 0 18px 40px rgba(22, 40, 60, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            background: var(--bg);
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 8% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 26rem),
                radial-gradient(circle at 92% 8%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent 30rem),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
            background-attachment: fixed;
            transition: background 0.25s ease, color 0.25s ease;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.45;
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, black, transparent 90%);
            z-index: -1;
        }

        body.player-open {
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        /* Header */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: color-mix(in srgb, var(--bg) 70%, transparent);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(22px) saturate(140%);
            box-shadow: 0 7px 28px rgba(0,0,0,.16);
        }

        .header-inner {
            width: min(1500px, calc(100% - 28px));
            min-height: 70px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .wordmark {
            display: inline-flex;
            align-items: center;
            font-size: 30px;
            font-weight: 950;
            letter-spacing: -1.8px;
            text-transform: lowercase;
        }

        .wordmark::before {
            content: "";
            width: 12px;
            height: 12px;
            margin-right: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow:
                0 0 0 6px color-mix(in srgb, var(--accent) 12%, transparent),
                0 0 28px color-mix(in srgb, var(--accent) 50%, transparent);
            animation: pulseDot 2.4s ease-in-out infinite;
        }

        .site-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .site-nav a,
        .theme-toggle {
            height: 41px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-2);
            color: var(--text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 850;
            cursor: pointer;
            transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
        }

        .site-nav a:hover,
        .theme-toggle:hover {
            transform: translateY(-1px);
            background: color-mix(in srgb, var(--accent) 13%, var(--surface-2));
            border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
            box-shadow: 0 8px 22px rgba(0,0,0,.18);
        }

        /* Main */
        main {
            width: min(1500px, calc(100% - 28px));
            margin: auto;
            padding: 22px 0 54px;
        }

        .controls-bar {
            margin-bottom: 20px;
        }

        #search {
            width: 100%;
            height: 54px;
            padding: 0 18px 0 48px;
            border: 1px solid var(--border);
            border-radius: 16px;
            outline: none;
            background:
                linear-gradient(135deg, color-mix(in srgb, var(--surface) 92%, transparent), color-mix(in srgb, var(--surface-2) 92%, transparent));
            color: var(--text);
            font-size: 15px;
            font-weight: 650;
            box-shadow: var(--shadow);
            transition: .18s ease;
        }

        .controls-bar {
            position: relative;
        }

        .controls-bar::before {
            content: "⌕";
            position: absolute;
            left: 17px;
            top: 50%;
            transform: translateY(-53%);
            color: var(--muted);
            font-size: 24px;
            line-height: 1;
            pointer-events: none;
        }

        #search::placeholder {
            color: var(--muted);
        }

        #search:focus {
            border-color: color-mix(in srgb, var(--accent) 70%, white 0%);
            box-shadow:
                0 0 0 4px color-mix(in srgb, var(--accent) 13%, transparent),
                var(--shadow);
        }

        .mode-status {
            margin: 0 0 11px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: .75px;
            text-transform: uppercase;
        }

        /* Favorites */
        .favorites-section {
            margin: 0 0 22px;
        }

        .favorites-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 11px;
        }

        .favorites-title {
            margin: 0;
            font-size: 14px;
            font-weight: 950;
            letter-spacing: -.25px;
        }

        .favorites-title::before {
            content: "★";
            margin-right: 8px;
            color: #ffd56a;
        }

        .favorites-empty {
            margin: 0;
            padding: 13px 0;
            color: var(--muted);
            font-size: 12px;
        }

        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 12px;
        }

        .favorite-card {
            position: relative;
            min-width: 0;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }

        .favorite-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-strong);
            box-shadow: 0 20px 40px rgba(0,0,0,.25);
        }

        .favorite-card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
        }

        .favorite-card img {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            background: var(--surface-2);
        }

        .favorite-card-title {
            margin: 0;
            padding: 10px 11px 11px;
            color: var(--text);
            font-size: 12px;
            font-weight: 800;
            line-height: 1.25;
        }

        .favorite-remove {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 4;
            width: 30px;
            height: 30px;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 10px;
            background: rgba(5,7,10,.75);
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: 900;
            line-height: 1;
            transition: .15s ease;
        }

        .favorite-remove:hover {
            transform: scale(1.06);
            background: var(--danger);
        }

        /* Game cards */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 16px;
            width: 100%;
        }

        .game-card,
        .game-item,
        .game {
            position: relative;
            min-width: 0;
            overflow: hidden;
            background:
                linear-gradient(180deg, color-mix(in srgb, var(--surface) 95%, transparent), color-mix(in srgb, var(--surface-2) 95%, transparent));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }

        .game-card:hover,
        .game-item:hover,
        .game:hover {
            transform: translateY(-5px);
            border-color: color-mix(in srgb, var(--accent) 24%, var(--border));
            box-shadow:
                0 22px 44px rgba(0,0,0,.28),
                0 0 0 1px color-mix(in srgb, var(--accent) 8%, transparent);
        }

        .game-card::after,
        .game-item::after,
        .game::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.07);
        }

        .game-card img,
        .game-item img,
        .game img {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            background: var(--surface-2);
            transition: transform .35s ease, filter .35s ease;
        }

        .game-card:hover img,
        .game-item:hover img,
        .game:hover img {
            transform: scale(1.045);
            filter: saturate(1.07) contrast(1.02);
        }

        .game-card-content,
        .game-info,
        .game-details {
            padding: 12px 13px 14px;
        }

        .game-card-title,
        .game-title,
        .game-name {
            margin: 0;
            color: var(--text);
            font-size: 14px;
            font-weight: 850;
            line-height: 1.25;
        }

        .game-card-description,
        .game-description {
            margin-top: 5px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.35;
        }

        .game-grid > a {
            display: block;
            min-width: 0;
        }

        .favorite-toggle {
            position: absolute;
            top: 9px;
            right: 9px;
            z-index: 8;
            width: 33px;
            height: 33px;
            padding: 0;
            border: 1px solid rgba(255,255,255,.11);
            border-radius: 11px;
            background: rgba(4,6,10,.75);
            color: white;
            cursor: pointer;
            font-size: 17px;
            line-height: 1;
            backdrop-filter: blur(8px);
            transition: transform .15s ease, background .15s ease, color .15s ease;
        }

        .favorite-toggle.active {
            color: #ffd56a;
            background: rgba(255, 188, 40, .12);
        }

        .favorite-toggle:hover {
            transform: scale(1.07);
            background: color-mix(in srgb, var(--accent) 20%, rgba(4,6,10,.75));
        }

        /* Player overlay */
        .game-player {
            position: fixed;
            inset: 0;
            z-index: 5000;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            background: rgba(4, 6, 10, .84);
            backdrop-filter: blur(22px) saturate(115%);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .22s ease, visibility .22s ease;
        }

        .game-player.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .player-topbar {
            min-height: 68px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,.10);
            background: rgba(11, 14, 20, .76);
            backdrop-filter: blur(18px);
            box-shadow: 0 10px 35px rgba(0,0,0,.20);
        }

        .player-title-wrap {
            min-width: 0;
            flex: 1;
            padding: 0 8px;
        }

        .player-kicker {
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 9px;
            font-weight: 950;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .player-title {
            margin: 0;
            overflow: hidden;
            color: white;
            font-size: 16px;
            font-weight: 900;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-btn {
            min-width: 44px;
            height: 42px;
            padding: 0 13px;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 12px;
            background: rgba(255,255,255,.065);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 850;
            transition: transform .16s ease, background .16s ease, border-color .16s ease, color .16s ease;
        }

        .player-btn:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,.11);
            border-color: rgba(255,255,255,.17);
        }

        .player-btn.primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-color: transparent;
            color: #061018;
            box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 22%, transparent);
        }

        .player-btn.primary:hover {
            box-shadow: 0 12px 28px color-mix(in srgb, var(--accent) 30%, transparent);
        }

        .player-btn.favorite {
            color: #ffd56a;
        }

        .player-btn.danger:hover {
            background: rgba(255, 90, 105, .14);
            border-color: rgba(255, 90, 105, .28);
        }

        .player-stage {
            min-height: 0;
            padding: 14px;
            display: flex;
            align-items: stretch;
            justify-content: center;
        }

        .player-frame-shell {
            width: min(1600px, 100%);
            height: 100%;
            min-height: 0;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 20px;
            background: #05070a;
            box-shadow: 0 30px 85px rgba(0,0,0,.44);
            position: relative;
        }

        .player-frame-shell::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            z-index: 2;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
        }

        #game-frame {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
        }

        .player-loading {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            z-index: 3;
            pointer-events: none;
            background: radial-gradient(circle at center, rgba(18,25,34,.68), rgba(0,0,0,.76));
            color: #dbe6ef;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .2px;
            transition: opacity .2s ease;
        }

        .player-loading.hidden {
            opacity: 0;
        }

        .player-toast {
            position: fixed;
            left: 50%;
            bottom: 26px;
            z-index: 7000;
            transform: translate(-50%, 14px);
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,.11);
            border-radius: 12px;
            background: rgba(9,12,17,.88);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 18px 45px rgba(0,0,0,.35);
            opacity: 0;
            visibility: hidden;
            transition: .2s ease;
            backdrop-filter: blur(14px);
        }

        .player-toast.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        /* Misc */
        #lumin-wrap {
            width: 100%;
        }

        #lumin-games {
            width: 100%;
            min-height: 560px;
        }

        .lumin-hidden {
            display: none !important;
        }

        .no-results {
            padding: 80px 0;
            margin: 0;
            text-align: center;
            color: var(--muted);
            font-size: 15px;
            font-weight: 750;
        }

        .site-footer {
            padding: 30px 18px 44px;
            border-top: 1px solid var(--border);
            background: color-mix(in srgb, var(--surface) 68%, transparent);
            text-align: center;
            backdrop-filter: blur(15px);
        }

        .site-footer p {
            margin: 0;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.6;
        }

        .site-footer a {
            font-weight: 800;
            transition: color .15s ease;
        }

        .site-footer a:hover {
            color: var(--accent);
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.12); opacity: .8; }
        }

        @media (min-width: 1300px) and (max-width: 1499px) {
            .game-grid,
            .favorites-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
        }

        @media (min-width: 950px) and (max-width: 1299px) {
            .game-grid,
            .favorites-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        }

        @media (min-width: 700px) and (max-width: 949px) {
            .game-grid,
            .favorites-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }

        @media (max-width: 699px) {
            .header-inner,
            main { width: calc(100% - 16px); }

            .header-inner { min-height: 60px; }

            .wordmark { font-size: 25px; }

            .site-nav a,
            .theme-toggle {
                height: 37px;
                padding: 0 10px;
                font-size: 11px;
            }

            main { padding-top: 13px; }

            .game-grid,
            .favorites-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .game-card,
            .game-item,
            .game,
            .favorite-card { border-radius: 14px; }

            .game-card-content,
            .game-info,
            .game-details { padding: 9px 10px 11px; }

            .game-card-title,
            .game-title,
            .game-name { font-size: 12px; }

            .player-topbar {
                min-height: 64px;
                padding: 9px;
                gap: 6px;
            }

            .player-kicker { display: none; }

            .player-title-wrap { padding: 0 5px; }

            .player-title { font-size: 13px; }

            .player-btn {
                width: 40px;
                min-width: 40px;
                height: 40px;
                padding: 0;
                font-size: 0;
            }

            .player-btn span {
                font-size: 17px;
            }

            .player-stage { padding: 8px; }

            .player-frame-shell { border-radius: 14px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation: none !important;
                transition: none !important;
            }
        }
    </style>

    <script>
        const savedTheme = localStorage.getItem("velora-theme");

        if (savedTheme === "light") {
            document.documentElement.classList.add("light");
        }
    </script>

<body>

    <header class="site-header">
        <div class="header-inner">

            <a class="wordmark center-title" href="g.html">
                velora
            </a>

            <nav class="site-nav">
                <button class="theme-toggle" id="theme-toggle" type="button">
                    light
                </button>

                <button class="theme-toggle" id="mode-toggle" type="button">
                    lumin
                </button>

            </nav>

        </div>
    </header>


    <div class="game-player" id="game-player" aria-hidden="true">
        <div class="player-topbar">
            <button class="player-btn" id="player-home" type="button" title="Home" aria-label="Home">
                <span>⌂</span><span>home</span>
            </button>

            <div class="player-title-wrap">
                <p class="player-kicker">now playing</p>
                <h2 class="player-title" id="player-title">game</h2>
            </div>

            <div class="player-actions">
                <button class="player-btn favorite" id="player-favorite" type="button" title="Favorite" aria-label="Favorite">
                    <span id="player-favorite-icon">☆</span><span>favorite</span>
                </button>
                <button class="player-btn" id="player-reload" type="button" title="Reload game" aria-label="Reload game">
                    <span>↻</span><span>reload</span>
                </button>
                <button class="player-btn primary" id="player-fullscreen" type="button" title="Fullscreen" aria-label="Fullscreen">
                    <span>⛶</span><span>fullscreen</span>
                </button>
            </div>
        </div>

        <div class="player-stage">
            <div class="player-frame-shell" id="player-frame-shell">
                <iframe id="game-frame"
                        title="Game player"
                        allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
                        allowfullscreen></iframe>
                <div class="player-loading" id="player-loading">loading game…</div>
            </div>
        </div>
    </div>
    <div class="player-toast" id="player-toast" role="status" aria-live="polite"></div>

    <main>

        <section class="controls-bar">
            <input
                id="search"
                type="search"
                placeholder="search games..."
                autocomplete="off"
                spellcheck="false"
                aria-label="Search games"
            >
        </section>

        <section class="favorites-section" id="favorites-section">
            <div class="favorites-header">
                <h2 class="favorites-title">favorites</h2>
            </div>
            <div class="favorites-grid" id="favorites-grid"></div>
            <p class="favorites-empty" id="favorites-empty">favorite games will appear here.</p>
        </section>

        <div class="mode-status" id="mode-status">static mode</div>

        <p id="no-results" class="no-results" style="display:none;">
            nothing here
        </p>

        <div class="game-grid" id="game-grid"></div>

        <div id="lumin-wrap" class="lumin-hidden">
            <div id="lumin-games"></div>
        </div>

    </main>

    <footer class="site-footer">
        <p>
            games from
            <a href="https://truffled.lol"
               target="_blank"
               rel="noopener">
                truffled.lol
            </a>,
            <a href="https://gn-math.dev"
               target="_blank"
               rel="noopener">
                gn-math
            </a>
            &amp;
            <a href="https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/edit?pli=1&tab=t.xs5z8u2rwov7"
               target="_blank"
               rel="noopener">
                Ultimate Game Stash
            </a>
        </p>
    </footer>

    <script src="games.js"></script>
    <script src="assets/app.js"></script>

    <script>
        const themeToggle = document.getElementById("theme-toggle");
        const modeToggle = document.getElementById("mode-toggle");
        const search = document.getElementById("search");
        const gameGrid = document.getElementById("game-grid");
        const noResults = document.getElementById("no-results");
        const favoritesGrid = document.getElementById("favorites-grid");
        const favoritesEmpty = document.getElementById("favorites-empty");
        const luminWrap = document.getElementById("lumin-wrap");
        const luminGames = document.getElementById("lumin-games");
        const modeStatus = document.getElementById("mode-status");

        const FAVORITES_KEY = "velora-favorites";
        const MODE_KEY = "velora-mode";
        const PLAYER_KEY = "velora-player-open";

        let luminLoaded = false;
        let luminActive = false;
        let luminLoading = null;

        const player = document.getElementById("game-player");
        const playerFrame = document.getElementById("game-frame");
        const playerFrameShell = document.getElementById("player-frame-shell");
        const playerTitle = document.getElementById("player-title");
        const playerLoading = document.getElementById("player-loading");
        const playerHome = document.getElementById("player-home");
        const playerFavorite = document.getElementById("player-favorite");
        const playerFavoriteIcon = document.getElementById("player-favorite-icon");
        const playerReload = document.getElementById("player-reload");
        const playerFullscreen = document.getElementById("player-fullscreen");
        const playerToast = document.getElementById("player-toast");

        let currentGame = null;
        let lastPlayerUrl = "";
        let toastTimer = null;

        // Function to close the game player
        function closeGamePlayer() {
            player.classList.remove("open");
            player.setAttribute("aria-hidden", "true");
            document.body.classList.remove("player-open");
            playerFrame.src = "";
        }

        // Listen for Escape key to close game
        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape" && player.classList.contains("open")) {
                closeGamePlayer();
            }
        });

        // Handle back button click (already existing but ensure it works)
        playerHome.addEventListener("click", closeGamePlayer);

        // Handle browser back navigation
        window.addEventListener("popstate", function() {
            if (player.classList.contains("open")) {
                closeGamePlayer();
            }
        });

        function getFavorites() {
            try {
                return JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]");
            } catch {
                return [];
            }
        }

        function saveFavorites(items) {
            localStorage.setItem(FAVORITES_KEY, JSON.stringify(items));
            renderFavorites();
            syncFavoriteButtons();
        }

        function gameInfo(card) {
            const link =
                (card.matches && card.matches("a[href]") ? card : null) ||
                card.querySelector("a[href]") ||
                card.closest("a[href]");

            if (!link || !link.href || link.href.startsWith("javascript:")) {
                return null;
            }

            const titleEl =
                card.querySelector(".game-card-title, .game-title, .game-name") ||
                card.querySelector("h1, h2, h3, h4, h5, h6");

            const title = (titleEl?.textContent || link.getAttribute("aria-label") || card.textContent || "game")
                .replace(/\s+/g, " ")
                .trim();
            const imgEl = card.querySelector("img");
            const img = imgEl?.src || "";

            return { link, title, img };
        }

        function openPlayer(info) {
            if (!info) return;

            currentGame = info;
            playerTitle.textContent = info.title;
            playerFrame.src = info.link.href;
            player.classList.add("open");
            player.setAttribute("aria-hidden", "false");
            document.body.classList.add("player-open");
            lastPlayerUrl = info.link.href;
            playerLoading.classList.remove("hidden");
            syncFavoriteButtons();
        }

        function syncFavoriteButtons() {
            const favorites = getFavorites();
            const isFavorited = currentGame && favorites.some(fav => fav.link === currentGame.link.href);
            if (isFavorited) {
                playerFavorite.classList.add("active");
                playerFavoriteIcon.textContent = "★";
            } else {
                playerFavorite.classList.remove("active");
                playerFavoriteIcon.textContent = "☆";
            }
        }

        function renderFavorites() {
            const favorites = getFavorites();
            favoritesGrid.innerHTML = "";

            if (favorites.length === 0) {
                favoritesEmpty.style.display = "block";
                return;
            }

            favoritesEmpty.style.display = "none";

            favorites.forEach(fav => {
                const card = document.createElement("a");
                card.href = fav.link;
                card.className = "favorite-card";
                card.innerHTML = `
                    <img src="${fav.img}" alt="${fav.title} Cover" loading="lazy">
                    <p class="favorite-card-title">${fav.title}</p>
                    <button class="favorite-remove" type="button" aria-label="Remove from favorites">×</button>
                `;

                const removeBtn = card.querySelector(".favorite-remove");
                removeBtn.addEventListener("click", (e) => {
                    e.preventDefault();
                    const updated = favorites.filter(f => f.link !== fav.link);
                    saveFavorites(updated);
                });

                card.addEventListener("click", (e) => {
                    if (!e.target.closest(".favorite-remove")) {
                        const info = { link: card, title: fav.title, img: fav.img };
                        info.link.href = fav.link;
                        openPlayer(info);
                    }
                });

                favoritesGrid.appendChild(card);
            });
        }

        function createGameCard(game) {
            const card = document.createElement("a");
            card.href = game.href;
            card.className = "game-card";
            card.innerHTML = `
                <img src="${game.img}" alt="${game.title} Cover" loading="lazy">
                <div class="game-card-content">
                    <h3 class="game-card-title">${game.title}</h3>
                    <p class="game-card-description">${game.description || ""}</p>
                </div>
                <button class="favorite-toggle" type="button" aria-label="Add to favorites">☆</button>
            `;

            const favoriteBtn = card.querySelector(".favorite-toggle");
            favoriteBtn.addEventListener("click", (e) => {
                e.preventDefault();
                const favorites = getFavorites();
                const isAlreadyFavorited = favorites.some(fav => fav.link === game.href);

                if (isAlreadyFavorited) {
                    const updated = favorites.filter(fav => fav.link !== game.href);
                    saveFavorites(updated);
                } else {
                    favorites.push({ link: game.href, title: game.title, img: game.img });
                    saveFavorites(favorites);
                }

                syncFavoriteBtnState(card, game.href);
            });

            card.addEventListener("click", (e) => {
                if (!e.target.closest(".favorite-toggle")) {
                    openPlayer(gameInfo(card));
                }
            });

            syncFavoriteBtnState(card, game.href);
            return card;
        }

        function syncFavoriteBtnState(card, gameHref) {
            const favorites = getFavorites();
            const btn = card.querySelector(".favorite-toggle");
            const isFavorited = favorites.some(fav => fav.link === gameHref);
            if (isFavorited) {
                btn.classList.add("active");
                btn.textContent = "★";
            } else {
                btn.classList.remove("active");
                btn.textContent = "☆";
            }
        }

        playerReload.addEventListener("click", () => {
            playerFrame.src = lastPlayerUrl;
        });

        playerFullscreen.addEventListener("click", () => {
            playerFrameShell.requestFullscreen?.().catch(err => {
                console.error("Fullscreen request failed:", err);
            });
        });

        playerFavorite.addEventListener("click", () => {
            if (!currentGame) return;

            const favorites = getFavorites();
            const isAlreadyFavorited = favorites.some(fav => fav.link === currentGame.link.href);

            if (isAlreadyFavorited) {
                const updated = favorites.filter(fav => fav.link !== currentGame.link.href);
                saveFavorites(updated);
            } else {
                favorites.push({
                    link: currentGame.link.href,
                    title: currentGame.title,
                    img: currentGame.img,
                });
                saveFavorites(updated);
            }

            syncFavoriteButtons();
        });

        function showToast(message) {
            playerToast.textContent = message;
            playerToast.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                playerToast.classList.remove("show");
            }, 2000);
        }

        playerFrame.addEventListener("load", () => {
            playerLoading.classList.add("hidden");
        });

        search.addEventListener("input", function() {
            const query = this.value.toLowerCase();
            const cards = document.querySelectorAll(".game-card");
            let visibleCount = 0;

            cards.forEach(card => {
                const title = card.querySelector(".game-card-title")?.textContent.toLowerCase() || "";
                const description = card.querySelector(".game-card-description")?.textContent.toLowerCase() || "";

                if (title.includes(query) || description.includes(query)) {
                    card.style.display = "";
                    visibleCount++;
                } else {
                    card.style.display = "none";
                }
            });

            noResults.style.display = visibleCount === 0 ? "block" : "none";
        });

        themeToggle.addEventListener("click", () => {
            const isDark = document.documentElement.classList.contains("light");
            if (isDark) {
                document.documentElement.classList.remove("light");
                localStorage.setItem("velora-theme", "dark");
            } else {
                document.documentElement.classList.add("light");
                localStorage.setItem("velora-theme", "light");
            }
        });

        modeToggle.addEventListener("click", async function() {
            if (luminActive) {
                luminActive = false;
                modeStatus.textContent = "static mode";
                luminWrap.classList.add("lumin-hidden");
                gameGrid.style.display = "";
                return;
            }

            if (!luminLoaded) {
                luminLoading = showToast("loading lumin mode...");
                try {
                    const response = await fetch("https://api.github.com/repos/WanoCapy/Lumin/contents/games");
                    const data = await response.json();

                    if (!Array.isArray(data)) throw new Error("Invalid response");

                    const games = data
                        .filter(file => file.name.endsWith(".html"))
                        .map(file => ({
                            title: file.name.replace(".html", "").replace(/[-_]/g, " "),
                            href: `https://cdn.jsdelivr.net/gh/WanoCapy/Lumin/games/${file.name}`,
                            description: "from lumin",
                            img: "https://via.placeholder.com/300x188?text=Lumin+Game",
                        }));

                    luminGames.innerHTML = "";
                    games.forEach(game => {
                        luminGames.appendChild(createGameCard(game));
                    });

                    luminLoaded = true;
                    showToast("lumin mode loaded!");
                } catch (error) {
                    showToast("failed to load lumin mode");
                    console.error("Error loading lumin:", error);
                    return;
                }
            }

            luminActive = true;
            modeStatus.textContent = "lumin mode";
            gameGrid.style.display = "none";
            luminWrap.classList.remove("lumin-hidden");
        });

        // Initialize
        const parser = new DOMParser();
        const doc = parser.parseFromString(games, "text/html");
        const gameLinks = doc.querySelectorAll("a");

        gameLinks.forEach(link => {
            const title = link.textContent.trim();
            const href = link.getAttribute("href");
            const img = link.querySelector("img")?.src || "";

            const card = createGameCard({ title, href, img, description: "" });
            gameGrid.appendChild(card);
        });

        renderFavorites();
    </script>
</body>
</html>
