<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Velora — V7 (maybe?)">
    <meta property="og:title" content="Velora">
    <meta property="og:description" content="The ultimate gateway to unblocked games at school">
    <meta property="og:type" content="website">

    <title>Velora</title>

    <link rel="stylesheet" href="assets/app.css">

    <style>
        :root {
            --bg: #18191c;
            --surface: #222428;
            --surface-2: #2a2c31;
            --text: #f4f4f4;
            --muted: #969aa2;
            --border: #33363d;
            --accent: #00c896;
            --accent-hover: #00b184;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        body.light {
            --bg: #eef0f2;
            --surface: #ffffff;
            --surface-2: #f7f8f9;
            --text: #17191c;
            --muted: #727780;
            --border: #dfe2e6;
            --accent: #00b987;
            --accent-hover: #009d73;
            --shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            transition: background 0.2s ease, color 0.2s ease;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* header */

        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: color-mix(in srgb, var(--surface) 94%, transparent);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(14px);
        }

        .header-inner {
            width: min(1500px, calc(100% - 24px));
            min-height: 64px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .wordmark {
            display: inline-flex;
            align-items: center;
            font-size: 29px;
            font-weight: 900;
            letter-spacing: -1.8px;
        }

        .wordmark::before {
            content: "";
            width: 12px;
            height: 12px;
            margin-right: 9px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 14%, transparent);
        }

        .site-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .site-nav a,
        .theme-toggle {
            height: 40px;
            padding: 0 14px;
            border: 0;
            border-radius: 11px;
            background: var(--surface-2);
            color: var(--text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.15s ease;
        }

        .site-nav a:hover,
        .theme-toggle:hover {
            background: var(--accent);
            color: white;
        }

        /* main */

        main {
            width: min(1500px, calc(100% - 24px));
            margin: auto;
            padding: 18px 0 48px;
        }

        .controls-bar {
            margin-bottom: 14px;
        }

        .mode-status {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.2px;
            text-transform: lowercase;
        }

        .favorites-section {
            margin: 0 0 18px;
        }

        .favorites-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 9px;
        }

        .favorites-title {
            margin: 0;
            font-size: 13px;
            font-weight: 900;
        }

        .favorites-empty {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
        }

        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 12px;
        }

        .favorite-card {
            position: relative;
            min-width: 0;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .favorite-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
        }

        .favorite-card img {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            background: var(--surface-2);
        }

        .favorite-card-title {
            margin: 0;
            padding: 9px 10px 10px;
            color: var(--text);
            font-size: 12px;
            font-weight: 800;
            line-height: 1.25;
        }

        .favorite-remove {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 29px;
            height: 29px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 9px;
            background: rgba(0, 0, 0, 0.72);
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: 900;
            line-height: 1;
        }

        .favorite-remove:hover {
            background: var(--accent);
        }

        .game-card,
        .game-item,
        .game {
            position: relative;
        }

        .favorite-toggle {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 8;
            width: 31px;
            height: 31px;
            padding: 0;
            border: 1px solid rgba(0, 0, 0, 0.14);
            border-radius: 9px;
            background: rgba(0, 0, 0, 0.72);
            color: white;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        .favorite-toggle.active {
            color: #ffd36a;
        }

        .favorite-toggle:hover {
            transform: scale(1.05);
        }

        #lumin-wrap {
            width: 100%;
        }

        #lumin-games {
            width: 100%;
            min-height: 500px;
        }

        .lumin-hidden {
            display: none !important;
        }

        #search {
            width: 100%;
            height: 50px;
            padding: 0 17px;
            border: 1px solid var(--border);
            border-radius: 13px;
            outline: none;
            background: var(--surface);
            color: var(--text);
            font-size: 15px;
            box-shadow: var(--shadow);
            transition: 0.15s ease;
        }

        #search::placeholder {
            color: var(--muted);
        }

        #search:focus {
            border-color: var(--accent);
            box-shadow:
                0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent),
                var(--shadow);
        }

        /* games */

        .game-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 15px;
            width: 100%;
        }

        .game-card,
        .game-item,
        .game {
            min-width: 0;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                background 0.2s ease;
        }

        .game-card:hover,
        .game-item:hover,
        .game:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
        }

        .game-card img,
        .game-item img,
        .game img {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            background: var(--surface-2);
        }

        .game-card-content,
        .game-info,
        .game-details {
            padding: 11px 12px 13px;
        }

        .game-card-title,
        .game-title,
        .game-name {
            margin: 0;
            color: var(--text);
            font-size: 14px;
            font-weight: 800;
            line-height: 1.25;
        }

        .game-card-description,
        .game-description {
            margin-top: 5px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.35;
        }

        .game-grid > a {
            display: block;
            min-width: 0;
        }

        /* no results */

        .no-results {
            padding: 70px 0;
            margin: 0;
            text-align: center;
            color: var(--muted);
            font-size: 15px;
            font-weight: 700;
        }

        /* footer */

        .site-footer {
            padding: 28px 18px 40px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            text-align: center;
        }

        .site-footer p {
            margin: 0;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.6;
        }

        .site-footer a {
            font-weight: 700;
        }

        .site-footer a:hover {
            color: var(--accent);
        }

        /* responsive */

        @media (min-width: 1300px) and (max-width: 1499px) {
            .game-grid,
            .favorites-grid {
                grid-template-columns: repeat(6, minmax(0, 1fr));
            }
        }

        @media (min-width: 950px) and (max-width: 1299px) {
            .game-grid,
            .favorites-grid {
                grid-template-columns: repeat(5, minmax(0, 1fr));
            }
        }

        @media (min-width: 700px) and (max-width: 949px) {
            .game-grid,
            .favorites-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 699px) {
            .header-inner,
            main {
                width: calc(100% - 14px);
            }

            .header-inner {
                min-height: 58px;
            }

            .wordmark {
                font-size: 25px;
            }

            .site-nav a,
            .theme-toggle {
                height: 36px;
                padding: 0 10px;
                font-size: 12px;
            }

            main {
                padding-top: 12px;
            }

            .game-grid,
            .favorites-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .game-card,
            .game-item,
            .game {
                border-radius: 11px;
            }

            .game-card-content,
            .game-info,
            .game-details {
                padding: 9px 10px 11px;
            }

            .game-card-title,
            .game-title,
            .game-name {
                font-size: 12px;
            }
        }
    </style>

    <script>
        const savedTheme = localStorage.getItem("velora-theme");

        if (savedTheme === "light") {
            document.documentElement.classList.add("light");
        }
    </script>

</head>

<body>

    <header class="site-header">
        <div class="header-inner">

            <a class="wordmark center-title" href="/">
                velora
            </a>

            <nav class="site-nav">
                <button class="theme-toggle" id="theme-toggle" type="button">
                    light
                </button>

                <button class="theme-toggle" id="mode-toggle" type="button">
                    lumin
                </button>

            </nav>

        </div>
    </header>

    <main>

        <section class="controls-bar">
            <input
                id="search"
                type="search"
                placeholder="search games..."
                autocomplete="off"
                spellcheck="false"
                aria-label="Search games"
            >
        </section>

        <section class="favorites-section" id="favorites-section">
            <div class="favorites-header">
                <h2 class="favorites-title">favorites</h2>
            </div>
            <div class="favorites-grid" id="favorites-grid"></div>
            <p class="favorites-empty" id="favorites-empty">favorite games will appear here.</p>
        </section>

        <div class="mode-status" id="mode-status">static mode</div>

        <p id="no-results" class="no-results" style="display:none;">
            nothing here
        </p>

        <div class="game-grid" id="game-grid"></div>

        <div id="lumin-wrap" class="lumin-hidden">
            <div id="lumin-games"></div>
        </div>

    </main>

    <footer class="site-footer">
        <p>
            games from
            <a href="https://truffled.lol"
               target="_blank"
               rel="noopener">
                truffled.lol
            </a>,
            <a href="https://gn-math.dev"
               target="_blank"
               rel="noopener">
                gn-math
            </a>
            &amp;
            <a href="https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/edit?pli=1&tab=t.xs5z8u2rwov7"
               target="_blank"
               rel="noopener">
                Ultimate Game Stash
            </a>
        </p>
    </footer>

    <script src="games.js"></script>
    <script src="assets/app.js"></script>

    <script>
        const themeToggle = document.getElementById("theme-toggle");
        const modeToggle = document.getElementById("mode-toggle");
        const search = document.getElementById("search");
        const gameGrid = document.getElementById("game-grid");
        const noResults = document.getElementById("no-results");
        const favoritesGrid = document.getElementById("favorites-grid");
        const favoritesEmpty = document.getElementById("favorites-empty");
        const luminWrap = document.getElementById("lumin-wrap");
        const luminGames = document.getElementById("lumin-games");
        const modeStatus = document.getElementById("mode-status");

        const FAVORITES_KEY = "velora-favorites";
        const MODE_KEY = "velora-mode";

        let luminLoaded = false;
        let luminActive = false;

        function getFavorites() {
            try {
                return JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]");
            } catch {
                return [];
            }
        }

        function saveFavorites(items) {
            localStorage.setItem(FAVORITES_KEY, JSON.stringify(items));
            renderFavorites();
            syncFavoriteButtons();
        }

        function gameInfo(card) {
            const link =
                (card.matches && card.matches("a[href]") ? card : null) ||
                card.querySelector("a[href]") ||
                card.closest("a[href]");

            if (!link || !link.href || link.href.startsWith("javascript:")) {
                return null;
            }

            const titleEl =
                card.querySelector(".game-card-title, .game-title, .game-name") ||
                card.querySelector("h1, h2, h3, h4, h5, h6");

            const title = (titleEl?.textContent || link.getAttribute("aria-label") || card.textContent || "game")
                .replace(/\s+/g, " ")
                .trim();

            const image = card.querySelector("img")?.src || "";

            return {
                id: link.href,
                title: title || "game",
                href: link.href,
                image
            };
        }

        function isFavorite(href) {
            return getFavorites().some(item => item.href === href);
        }

        function toggleFavorite(info, event) {
            event.preventDefault();
            event.stopPropagation();

            const favorites = getFavorites();
            const index = favorites.findIndex(item => item.href === info.href);

            if (index >= 0) {
                favorites.splice(index, 1);
            } else {
                favorites.unshift(info);
            }

            saveFavorites(favorites);
        }

        function addFavoriteButton(card) {
            if (card.querySelector(":scope > .favorite-toggle")) return;

            const info = gameInfo(card);
            if (!info) return;

            const button = document.createElement("button");
            button.type = "button";
            button.className = "favorite-toggle";
            button.setAttribute("aria-label", "favorite " + info.title);

            button.addEventListener("click", event => toggleFavorite(info, event));

            card.appendChild(button);
            updateFavoriteButton(button, info.href);
        }

        function updateFavoriteButton(button, href) {
            const active = isFavorite(href);
            button.classList.toggle("active", active);
            button.textContent = active ? "★" : "☆";
            button.title = active ? "remove favorite" : "add favorite";
        }

        function syncFavoriteButtons() {
            gameGrid.querySelectorAll(".game-card, .game-item, .game").forEach(card => {
                addFavoriteButton(card);
                const button = card.querySelector(":scope > .favorite-toggle");
                const info = gameInfo(card);
                if (button && info) updateFavoriteButton(button, info.href);
            });
        }

        function renderFavorites() {
            const favorites = getFavorites();
            favoritesGrid.innerHTML = "";

            favorites.forEach(item => {
                const card = document.createElement("div");
                card.className = "favorite-card";

                const link = document.createElement("a");
                link.href = item.href;
                link.target = "_self";

                if (item.image) {
                    const img = document.createElement("img");
                    img.src = item.image;
                    img.alt = "";
                    img.loading = "lazy";
                    link.appendChild(img);
                }

                const title = document.createElement("p");
                title.className = "favorite-card-title";
                title.textContent = item.title;
                link.appendChild(title);

                const remove = document.createElement("button");
                remove.type = "button";
                remove.className = "favorite-remove";
                remove.textContent = "×";
                remove.setAttribute("aria-label", "remove " + item.title + " from favorites");
                remove.addEventListener("click", event => {
                    event.preventDefault();
                    event.stopPropagation();
                    const next = getFavorites().filter(fav => fav.href !== item.href);
                    saveFavorites(next);
                });

                card.appendChild(link);
                card.appendChild(remove);
                favoritesGrid.appendChild(card);
            });

            favoritesEmpty.style.display = favorites.length ? "none" : "block";
        }

        function setMode(mode) {
            luminActive = mode === "lumin";
            localStorage.setItem(MODE_KEY, luminActive ? "lumin" : "static");

            gameGrid.classList.toggle("lumin-hidden", luminActive);
            noResults.classList.toggle("lumin-hidden", luminActive);
            luminWrap.classList.toggle("lumin-hidden", !luminActive);
            search.classList.toggle("lumin-hidden", luminActive);

            if (luminActive) {
                modeToggle.textContent = "static";
                modeStatus.textContent = "luminSDK mode";
                if (!luminLoaded) {
                    loadLumin();
                } else {
                    initLumin();
                }
            } else {
                modeToggle.textContent = "lumin";
                modeStatus.textContent = "static mode";
                destroyLumin();
                syncFavoriteButtons();
            }
        }

        function loadLumin() {
            if (window.Lumin) {
                luminLoaded = true;
                initLumin();
                return;
            }

            const existing = document.querySelector('script[data-lumin-sdk]');
            if (existing) return;

            const script = document.createElement("script");
            script.src = "https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js";
            script.dataset.luminSdk = "true";
            script.onload = () => {
                luminLoaded = true;
                if (luminActive) initLumin();
            };
            document.head.appendChild(script);
        }

        function initLumin() {
            if (!window.Lumin) return;

            destroyLumin();

            const theme = document.body.classList.contains("light") ? "light" : "dark";

            window.Lumin.init({
                container: "#lumin-games",
                theme,
                columns: 8,
                rows: 4
            });
        }

        function destroyLumin() {
            if (window.Lumin && typeof window.Lumin.destroy === "function") {
                try {
                    window.Lumin.destroy();
                } catch {}
            }
            luminGames.innerHTML = "";
        }

        function updateThemeButton() {
            themeToggle.textContent =
                document.body.classList.contains("light")
                    ? "dark"
                    : "light";
        }

        themeToggle.addEventListener("click", () => {
            const light = document.body.classList.toggle("light");

            localStorage.setItem(
                "velora-theme",
                light ? "light"
                    : "dark"
            );

            updateThemeButton();

            if (luminActive) initLumin();
        });

        modeToggle.addEventListener("click", () => {
            setMode(luminActive ? "static" : "lumin");
        });

        if (localStorage.getItem("velora-theme") === "light") {
            document.body.classList.add("light");
        }

        renderFavorites();
        syncFavoriteButtons();

        const observer = new MutationObserver(() => {
            if (!luminActive) syncFavoriteButtons();
        });

        observer.observe(gameGrid, {
            childList: true,
            subtree: true
        });

        updateThemeButton();
        setMode(localStorage.getItem(MODE_KEY) === "lumin" ? "lumin" : "static");
    </script>

</body>
</html>
